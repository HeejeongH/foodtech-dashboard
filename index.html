        const newId = res.rows[0].id;
        toast('행사가 등록되었습니다', 'success');

      } catch (e) {
        toast('등록 실패: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = '등록';
      }
    }

              </select>
            </div>
            <div class="form-field">
              <label>발표 일자</label>
              <input type="date" class="form-input" id="pr-date">
            </div>
            <div class="form-field">
              <label>발표 시간</label>
              <input type="text" class="form-input" id="pr-time" placeholder="예: 14:00-14:30">
            </div>
            <div class="form-field">
              <label>상태</label>
              <select class="form-select" id="pr-status">
                <option value="예정">예정</option>
                <option value="확정">확정</option>
                <option value="완료">완료</option>
                <option value="취소">취소</option>
              </select>
            </div>
            <div class="form-field form-full">
              <label>초록/개요</label>
              <textarea class="form-textarea" id="pr-abstract" placeholder="발표 요약, 핵심 메시지"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn" onclick="history_back()">취소</button>
            <button class="btn btn-primary" id="pr-submit">등록</button>
          </div>
        </div>
      `;

      // Setup autocomplete if applicable
      if (!preselectedPerson) {
        setupPersonAutocomplete();
      }
      document.getElementById('pr-submit').onclick = () => submitPresentation(preselectedPerson);
      window.history_back = () => {
        if (preselectedEvent) __nav('event', {event_id: preselectedEvent.id});
        else if (preselectedPerson) __nav('person', {person_id: preselectedPerson.id});
        else __nav('events');
      };
    }

    function setupPersonAutocomplete() {
      const input = document.getElementById('pr-person-search');
      const hidden = document.getElementById('pr-person-id');
      const list = document.getElementById('pr-person-list');
      let debounceTimer;

      input.addEventListener('input', () => {
        hidden.value = '';
        const q = input.value.trim();
        clearTimeout(debounceTimer);
        if (q.length < 1) { list.style.display = 'none'; return; }
        debounceTimer = setTimeout(async () => {
          try {
            const res = await window.agentdb.executeQuery('search_people_for_picker', { q: q });
            if (res.rows.length === 0) { list.style.display = 'none'; return; }
            list.innerHTML = res.rows.map(r => `
              <div class="autocomplete-item" data-id="${r.id}" data-name="${esc(r.name)}">
                <div><b>${esc(r.name)}</b> ${r.position ? '· ' + esc(r.position) : ''}</div>
                <div class="sub">${esc(r.organization || '')}</div>
              </div>
            `).join('');
            list.style.display = 'block';
            list.querySelectorAll('.autocomplete-item').forEach(item => {
              item.onclick = () => {
                hidden.value = item.dataset.id;
                input.value = item.dataset.name;
                list.style.display = 'none';
              };
            });
          } catch (e) { console.error(e); }
        }, 200);
      });
      document.addEventListener('click', (ev) => {
        if (!ev.target.closest('.autocomplete-wrap')) list.style.display = 'none';
      });
    }

    async function submitPresentation(preselectedPerson) {
      const eventId = Number(document.getElementById('pr-event-id').value);
      const title = document.getElementById('pr-title').value.trim();
      if (!eventId) { toast('행사를 선택하세요', 'error'); return; }
      if (!title) { toast('발표 제목을 입력하세요', 'error'); return; }

      let personId = preselectedPerson ? preselectedPerson.id : Number(document.getElementById('pr-person-id').value || 0) || null;
      let nameSnapshot = null;
      if (!preselectedPerson) {
        nameSnapshot = document.getElementById('pr-name-snapshot').value.trim() || null;
        // If user typed in the search but didn't pick, keep the text as snapshot
        if (!personId && !nameSnapshot) {
          const typed = document.getElementById('pr-person-search').value.trim();
          if (typed) nameSnapshot = typed;
        }
      }

      const btn = document.getElementById('pr-submit');
      btn.disabled = true; btn.textContent = '등록 중…';
      try {
        await window.agentdb.executeQuery('create_presentation', {
          event_id: eventId,
          person_id: personId,
          presenter_name_snapshot: nameSnapshot,
          title: title,
          topic: document.getElementById('pr-topic').value.trim() || null,
          session_type: document.getElementById('pr-session-type').value,
          session_date: document.getElementById('pr-date').value || '',
          session_time: document.getElementById('pr-time').value.trim() || null,
          abstract: document.getElementById('pr-abstract').value.trim() || null,
          status: document.getElementById('pr-status').value,
        });
        toast('발표가 등록되었습니다', 'success');
        __nav('event', { event_id: eventId });
      } catch (e) {
        toast('등록 실패: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = '등록';
      }
    }

    // ---------- Client-side table filter ----------
    window.__filterTable = function(tableId, q) {
      q = (q || '').toLowerCase().trim();
      document.querySelectorAll(`table[data-search-table="${tableId}"] tbody tr`).forEach(tr => {
        const t = tr.textContent.toLowerCase();
        tr.style.display = (!q || t.includes(q)) ? '' : 'none';
      });
    };

    // ---------- AI 관리자 챗봇 (베타) ----------
    const AI_FIELD_LABELS = {
      position: '직위', department: '부서/학과', email: '이메일', phone: '전화', expertise: '전문 분야',
      wftc_status: '협의회 가입 상태', membership_tier: '협의회 등급', member_type: '회원 유형', join_date: '가입일',
    };

    function appendAiMsg(text, cls) {
      const log = document.getElementById('ai-agent-log');
      const div = document.createElement('div');
      div.className = 'ai-msg ' + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderAiProposal(proposal) {
      const updates = proposal.updates || {};
      const rows = Object.entries(updates).map(([k, v]) => `
        <div class="ai-proposal-row"><span class="k">${esc(AI_FIELD_LABELS[k] || k)}</span><span>${esc(String(v))}</span></div>
      `).join('');
      const box = document.getElementById('ai-agent-proposal');
      box.innerHTML = `
        <div class="ai-proposal">
          <div style="font-weight:600; margin-bottom:6px">${esc(proposal.person_name || '')} 수정 제안</div>
          ${proposal.summary ? `<div class="t-body" style="font-size:12px; margin-bottom:8px">${esc(proposal.summary)}</div>` : ''}
          ${rows || '<div class="t-body" style="font-size:12px">변경할 필드가 없습니다.</div>'}
          <div style="display:flex; gap:8px; margin-top:10px">
            <button class="btn" id="ai-agent-cancel">취소</button>
            <button class="btn btn-primary" id="ai-agent-apply">적용</button>
          </div>
        </div>
      `;
      document.getElementById('ai-agent-cancel').onclick = () => { box.innerHTML = ''; };
      document.getElementById('ai-agent-apply').onclick = () => applyAiProposal(proposal);
    }

    async function applyAiProposal(proposal) {
      const updates = proposal.updates || {};
      const personFields = ['position', 'department', 'email', 'phone', 'expertise'];
      const wftcFields = ['wftc_status', 'membership_tier', 'member_type', 'join_date'];
      const applyBtn = document.getElementById('ai-agent-apply');
      if (applyBtn) { applyBtn.disabled = true; applyBtn.textContent = '적용 중…'; }
      try {
        if (personFields.some(k => k in updates)) {
          await window.agentdb.executeQuery('update_person', { person_id: proposal.person_id, ...updates });
        }
        if (wftcFields.some(k => k in updates)) {
          await window.agentdb.executeQuery('update_wftc_membership', {
            person_id: proposal.person_id,
            membership_status: updates.wftc_status,
            membership_tier: updates.membership_tier,
            member_type: updates.member_type,
            join_date: updates.join_date,
          });
        }
        toast(`${proposal.person_name} 정보가 반영되었습니다`, 'success');
        document.getElementById('ai-agent-proposal').innerHTML = '';
        if (route.view === 'person' && Number(route.params.person_id) === Number(proposal.person_id)) {
          renderPersonDetail(proposal.person_id, false);
        }
      } catch (e) {
        toast('적용 실패: ' + e.message, 'error');
        if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = '적용'; }
      }
    }

    async function sendAiMessage() {
      const input = document.getElementById('ai-agent-input');
      const fileInput = document.getElementById('ai-agent-file');
      const message = input.value.trim();
      const file = fileInput.files[0];
      if (!message && !file) return;

      appendAiMsg(message || `📎 ${file.name}`, 'ai-msg-user');
      input.value = '';
      document.getElementById('ai-agent-proposal').innerHTML = '';
      const sendBtn = document.getElementById('ai-agent-send');
      sendBtn.disabled = true;
      try {
        const body = { message };
        if (file) {
          body.fileBase64 = await fileToBase64(file);
          body.mediaType = file.type || 'application/pdf';
        }
        fileInput.value = '';
        const res = await fetch('/api/agent', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.error) appendAiMsg('오류: ' + data.error, 'ai-msg-error');
        else if (data.proposal) { appendAiMsg(data.proposal.summary || '변경안을 제안합니다.', 'ai-msg-bot'); renderAiProposal(data.proposal); }
        else appendAiMsg(data.message || '(응답 없음)', 'ai-msg-bot');
      } catch (e) {
        appendAiMsg('오류: ' + e.message, 'ai-msg-error');
      } finally {
        sendBtn.disabled = false;
      }
    }

    function initAiAgent() {
      const modal = document.getElementById('ai-agent-modal');
      document.getElementById('ai-agent-fab').addEventListener('click', () => modal.showModal());
      document.getElementById('ai-agent-close').addEventListener('click', () => modal.close());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
      document.getElementById('ai-agent-send').addEventListener('click', sendAiMessage);
      document.getElementById('ai-agent-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAiMessage(); });
    }

    // ---------- Boot ----------
    console.log('[init] starting');
    initAiAgent();
    renderRoute();
  </script>
</body>
</html>
