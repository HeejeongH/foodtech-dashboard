<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울대 푸드테크 센터 · 월드푸드테크협의회</title>

  <!-- Supabase JS Client (loaded from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>

  <style>
    /* ============================================================
       B-Suite 대체 토큰 (원래 AgentDB가 주입하던 팔레트를 자체 정의)
       ============================================================ */
    :root {
      /* ── WFT26 ConfEx 색상 팔레트 ── */
      --ink-025: rgba(154,124,194,.04);
      --ink-050: #f0f0f8;
      --ink-100: #ddddf0;
      --ink-200: #b8b8d8;
      --ink-300: #8888bb;
      --ink-500: #6666a0;
      --ink-600: #4a4a88;
      --ink-700: #2e2e6e;
      --ink-800: #1a1a50;
      --ink-900: #0b122c;
      --brand-500: #005cb9;    /* WFTC 메인 블루 */
      --brand-600: #0050a3;
      --brand-700: #003d80;
      --accent-gold: #FFD338;  /* WFT 골드 액센트 */
      --accent-purple: #9A7CC2; /* 퍼플 서브 */
      --accent-coral: #FF6D64; /* 버튼 코랄 */
      --success-500: #10b981;
      --success-700: #047857;
      --warn-500: #d97706;
      --warn-700: #a16207;
      --danger-500: #ef4444;
      --bg: #0e1535;           /* 딥 다크 네이비 */
      --bg-card: #161d40;      /* 카드 다크 */
      --bg-card-light: #1e2650;
      --shadow-card: 0 2px 8px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.30);
      --r-sm: 6px;
      --r-md: 10px;
      --s-xs: 4px;
      --s-sm: 8px;
      --s-md: 16px;
      --s-lg: 24px;
      --s-xl: 32px;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: #e0e4f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Noto Sans KR', sans-serif;
      font-size: 14px;
    }
    .gs-wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }
    .gs-hero { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 20px; }
    .gs-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(154,124,194,.15); border: 1px solid rgba(154,124,194,.30); border-radius: 999px; font-size: 11px; color: #b8a8e0; }
    .gs-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success-500); }
    .gs-grid { display: grid; }
    .gs-empty { display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .t-h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
    .t-h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.005em; }
    .t-h3 { font-size: 16px; font-weight: 600; }
    .t-body { font-size: 14px; color: #9090b8; }
    .t-small { font-size: 12px; }
    .t-micro { font-size: 11px; color: #7878a8; letter-spacing: .04em; }

    /* Extra styles on top of the base tokens */
    .clickable { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
    .clickable:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.10); }
    .breadcrumb {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #7878a8;
      margin-bottom: 16px;
    }
    .breadcrumb a {
      color: #9A7CC2; cursor: pointer; text-decoration: none;
    }
    .breadcrumb a:hover { text-decoration: underline; color: #FFD338; }
    .breadcrumb .sep { color: #4a4a88; }
    .data-table {
      width: 100%; border-collapse: collapse;
      background: var(--bg-card);
      border-radius: var(--r-md, 8px);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(154,124,194,.15);
    }
    .data-table th {
      text-align: left; padding: 12px 14px;
      background: rgba(154,124,194,.10);
      font-size: 12px; font-weight: 600;
      color: #9A7CC2;
      border-bottom: 1px solid rgba(154,124,194,.20);
      position: sticky; top: 0; z-index: 1;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .data-table td {
      padding: 12px 14px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      color: #c8cce8;
    }
    .data-table tr:hover td { background: rgba(154,124,194,.07); }
    .data-table tr.row-clickable { cursor: pointer; }
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--r-md, 8px);
    }
    .table-wrap.scrollable {
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }
    /* When there are many small grouped tables (e.g. cohorts on a program page),
       don't cap each one — let the page scroll normally so all rows show. */
    .cohort-header + .table-wrap {
      max-height: none;
      overflow-y: visible;
    }
    .filter-bar {
      display: flex; gap: 12px; align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select, .form-input, .form-select, .form-textarea {
      padding: 8px 12px;
      border: 1px solid rgba(154,124,194,.25);
      border-radius: var(--r-sm, 6px);
      font-size: 13px;
      background: #1e2650;
      color: #e0e4f0;
      font-family: inherit;
    }
    .filter-bar input::placeholder, .form-input::placeholder { color: #5555888; }
    .filter-bar input:focus, .filter-bar select:focus, .form-input:focus, .form-select:focus {
      outline: none;
      border-color: #9A7CC2;
      box-shadow: 0 0 0 3px rgba(154,124,194,.15);
    }
    .filter-bar input, .filter-bar select { min-width: 220px; }
    .filter-bar .count-badge {
      padding: 6px 12px;
      background: rgba(154,124,194,.15);
      border: 1px solid rgba(154,124,194,.25);
      border-radius: 999px;
      font-size: 12px;
      color: #9A7CC2;
      font-weight: 500;
    }
    .status-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }
    .status-joined { background: rgba(16,185,129,.18); color: #34d399; border: 1px solid rgba(16,185,129,.25); }
    .status-none { background: rgba(255,255,255,.06); color: #8888bb; border: 1px solid rgba(255,255,255,.08); }
    .status-pending { background: rgba(255,211,56,.15); color: #FFD338; border: 1px solid rgba(255,211,56,.25); }
    .status-scheduled { background: rgba(0,92,185,.20); color: #60a5fa; border: 1px solid rgba(0,92,185,.30); }
    .status-done { background: rgba(16,185,129,.18); color: #34d399; border: 1px solid rgba(16,185,129,.25); }
    .status-cancelled { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.20); }
    .program-card {
      border: 1px solid rgba(154,124,194,.20);
      padding: 20px;
      background: var(--bg-card);
      border-radius: var(--r-md, 8px);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
    }
    .program-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.10); }
    .program-card h3 { margin: 0 0 8px; font-size: 16px; color: #e0e4f0; }
    .program-card .stat-row { display: flex; gap: 24px; margin-top: 12px; }
    .program-card .stat-value { font-size: 22px; font-weight: 600; color: #FFD338; font-variant-numeric: tabular-nums; }
    .program-card .stat-label { font-size: 11px; color: #7878a8; text-transform: uppercase; letter-spacing: .04em; }
    .program-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .event-card {
      padding: 18px 20px;
      background: var(--bg-card);
      border-radius: var(--r-md, 8px);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
      border-left: 3px solid var(--brand-500);
    }
    .event-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.10); }
    .event-card h3 { margin: 0 0 6px; font-size: 15px; color: #e0e4f0; }
    .event-card .event-meta {
      display: flex; gap: 12px; flex-wrap: wrap;
      font-size: 12px; color: var(--ink-500);
      margin: 6px 0;
    }
    .event-card .event-meta span { display: inline-flex; align-items: center; gap: 4px; }
    .event-card .event-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .event-card .event-bottom .stat-value { font-size: 18px; font-weight: 600; }
    .cohort-header {
      margin: 24px 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-700);
      display: flex; align-items: center; gap: 8px;
    }
    .cohort-header .badge {
      padding: 2px 8px;
      background: var(--ink-050);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-600);
    }
    .empty-msg {
      padding: 40px;
      text-align: center;
      color: var(--ink-500);
      font-size: 14px;
      background: var(--bg-card);
      border-radius: var(--r-md, 8px);
      box-shadow: var(--shadow-card);
    }
    .empty-msg .cta { margin-top: 12px; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .detail-field {
      background: var(--bg-card);
      padding: 14px 16px;
      border-radius: var(--r-sm, 6px);
      box-shadow: var(--shadow-card);
    }
    .detail-field .label {
      font-size: 11px;
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px;
    }
    .detail-field .value {
      font-size: 14px;
      color: #e0e4f0;
      word-break: break-word;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: var(--r-sm, 6px);
      border: 1px solid rgba(154,124,194,.30);
      background: rgba(154,124,194,.10);
      color: #c8cce8;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .12s;
      font-family: inherit;
    }
    .btn:hover { background: rgba(154,124,194,.20); }
    .btn-primary { background: linear-gradient(90deg, #FF6D64 0%, #FFD338 100%); color: #0b122c; border-color: transparent; font-weight: 600; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { border-color: rgba(255,255,255,.20); background: transparent; color: #c8cce8; }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .form-full { grid-column: 1 / -1; }
    .form-field label {
      display: block;
      font-size: 12px; font-weight: 500;
      color: #9A7CC2;
      margin-bottom: 4px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .form-input, .form-select, .form-textarea { width: 100%; box-sizing: border-box; }
    .form-textarea { min-height: 80px; resize: vertical; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .form-hint { font-size: 11px; color: #7878a8; margin-top: 4px; }
    .form-container {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--r-md, 8px);
      box-shadow: var(--shadow-card);
    }

    /* Autocomplete */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #1e2650;
      border: 1px solid rgba(154,124,194,.25);
      border-radius: var(--r-sm, 6px);
      max-height: 240px; overflow: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,.50);
      display: none;
    }
    .autocomplete-item {
      padding: 8px 12px; cursor: pointer;
      font-size: 13px; color: #c8cce8;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .autocomplete-item:hover, .autocomplete-item.active { background: rgba(154,124,194,.15); }
    .autocomplete-item .sub { font-size: 11px; color: #7878a8; margin-top: 2px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 18px;
      border-radius: var(--r-sm, 6px);
      background: var(--ink-900);
      color: white;
      font-size: 13px;
      box-shadow: 0 6px 16px rgba(0,0,0,.20);
      z-index: 1000;
      opacity: 0; transform: translateY(10px);
      transition: opacity .18s, transform .18s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--success-500); }
    .toast.error { background: var(--danger-500); }

    /* ============================================================
       SNU Marketing Dashboard theme — scoped to .snu-hero-page only.
       Design direction: SNU deep navy anchor + gold accent, magazine-
       style hero with the WFTC membership pipeline as the protagonist.
       ============================================================ */
    /* When dashboard route is active, remove the gs-wrap padding
       so the SNU hero can reach to page edges. */
    #root.root-fullbleed {
      padding: 0 !important;
      max-width: none !important;
      margin: 0 !important;
    }
    .snu-hero-page {
      --snu-navy: #0b122c;       /* 딥 다크 배경 */
      --snu-navy-2: #0e1535;
      --snu-navy-3: #080f24;
      --snu-gold: #FFD338;       /* WFT 골드 */
      --snu-gold-soft: #ffe580;
      --snu-cream: #f0f0f8;
      --snu-ink: #e0e4f0;
      --snu-ink-2: #b8bce0;
      --snu-ink-3: #8888bb;
      --snu-line: rgba(154,124,194,.20);
      --snu-line-2: rgba(154,124,194,.12);
      --snu-surface: #0e1535;
      --snu-surface-2: #161d40;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Noto Sans KR', sans-serif;
      color: var(--snu-ink);
      width: 100%;
    }
    .snu-hero-page * { box-sizing: border-box; }

    /* ---- Hero ---- */
    .snu-hero {
      background:
        radial-gradient(ellipse 70% 50% at 80% 20%, rgba(154,124,194,.25), transparent 55%),
        radial-gradient(ellipse 50% 60% at 10% 80%, rgba(0,92,185,.20), transparent 55%),
        radial-gradient(ellipse 40% 40% at 90% 90%, rgba(255,109,100,.12), transparent 50%),
        linear-gradient(135deg, #080f24 0%, #0b122c 50%, #0d1540 100%);
      color: #fff;
      padding: 44px 40px 56px;
      position: relative;
      overflow: hidden;
    }
    .snu-hero::before {
      /* subtle grid pattern */
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .snu-hero-inner { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; }
    .snu-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      color: #9A7CC2;
      margin-bottom: 20px;
    }
    .snu-eyebrow::before {
      content: ""; width: 24px; height: 1px; background: #9A7CC2;
    }
    .snu-hero h1.snu-headline {
      margin: 0 0 12px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
      max-width: 720px;
      text-wrap: pretty;
    }
    .snu-hero h1.snu-headline .accent { color: var(--snu-gold-soft); }
    .snu-hero .snu-lead {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,.75);
      max-width: 620px;
      margin: 0 0 32px;
    }

    /* Hero pipeline: the star of the page */
    .snu-pipeline {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 24px 28px 20px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .snu-pipeline-title {
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.55);
      margin-bottom: 16px;
      font-weight: 600;
    }
    .snu-pipeline-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .snu-stage {
      position: relative;
      padding: 6px 4px 4px 0;
    }
    .snu-stage + .snu-stage::before {
      content: "→";
      position: absolute;
      left: -14px; top: 18px;
      color: rgba(255,255,255,.28);
      font-size: 16px;
    }
    .snu-stage-label {
      font-size: 11px;
      color: rgba(255,255,255,.55);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .snu-stage-value {
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      display: flex; align-items: baseline; gap: 6px;
    }
    .snu-stage-value .unit { font-size: 13px; font-weight: 400; color: rgba(255,255,255,.55); }
    .snu-stage.final .snu-stage-value { color: var(--snu-gold-soft); }
    .snu-stage-bar {
      margin-top: 10px;
      height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.10);
      overflow: hidden;
    }
    .snu-stage-bar > span {
      display: block; height: 100%;
      background: linear-gradient(90deg, var(--snu-gold) 0%, var(--snu-gold-soft) 100%);
      border-radius: 2px;
      transition: width .6s cubic-bezier(.2,.7,.2,1);
    }

    /* CTAs under hero */
    .snu-hero-ctas {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-top: 24px;
    }
    .snu-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px;
      font-size: 14px; font-weight: 600;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform .12s, background .12s, border-color .12s;
      font-family: inherit;
    }
    .snu-btn-primary {
      background: linear-gradient(90deg, #FF6D64 0%, #FFD338 100%);
      color: #0b122c;
    }
    .snu-btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .snu-btn-ghost {
      background: transparent;
      color: #fff;
      border-color: rgba(255,255,255,.30);
    }
    .snu-btn-ghost:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.50); }
    .snu-btn-arrow::after { content: "→"; }

    /* ---- Content sections below hero ---- */
    .snu-content {
      max-width: 1240px;
      margin: 0 auto;
      padding: 56px 40px 48px;
      background: var(--snu-surface);
    }
    .snu-section { margin-bottom: 56px; }
    .snu-section:last-child { margin-bottom: 0; }

    .snu-section-head {
      display: flex; align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .snu-section-title {
      font-size: 24px; font-weight: 700; letter-spacing: -0.01em;
      color: #e0e4f0;
      margin: 0;
    }
    .snu-section-title .num {
      display: inline-block;
      font-size: 12px; font-weight: 600;
      color: #9A7CC2;
      margin-right: 12px;
      letter-spacing: .12em;
      vertical-align: middle;
      transform: translateY(-2px);
    }
    .snu-section-sub {
      font-size: 14px; color: var(--snu-ink-3); margin: 6px 0 0;
    }
    .snu-section-link {
      font-size: 13px; font-weight: 600;
      color: var(--snu-navy);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .snu-section-link:hover { color: var(--snu-gold); }

    /* Stat grid — used by "Reach" section */
    .snu-stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0;
      border: 1px solid var(--snu-line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--snu-surface);
    }
    .snu-stat {
      padding: 24px 28px;
      border-right: 1px solid var(--snu-line);
      cursor: pointer;
      transition: background .12s;
      position: relative;
    }
    .snu-stat:last-child { border-right: none; }
    .snu-stat:hover { background: var(--snu-surface-2); }
    .snu-stat-label {
      font-size: 12px; font-weight: 500;
      color: var(--snu-ink-3);
      letter-spacing: .04em;
      margin-bottom: 8px;
    }
    .snu-stat-value {
      font-size: 34px; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--snu-ink);
    }
    .snu-stat-sub {
      font-size: 12px;
      color: var(--snu-ink-3);
      margin-top: 8px;
    }
    @media (max-width: 700px) {
      .snu-stat { border-right: none; border-bottom: 1px solid var(--snu-line); }
      .snu-stat:last-child { border-bottom: none; }
    }

    /* Program showcase cards */
    .snu-program-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .snu-program {
      background: var(--snu-surface);
      border: 1px solid var(--snu-line);
      border-radius: 14px;
      padding: 28px 26px;
      cursor: pointer;
      transition: transform .18s, border-color .18s, box-shadow .18s;
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column; gap: 20px;
    }
    .snu-program::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--snu-navy), var(--snu-gold));
      opacity: 0; transition: opacity .18s;
    }
    .snu-program:hover {
      transform: translateY(-3px);
      border-color: var(--snu-navy);
      box-shadow: 0 14px 32px rgba(0,48,87,.14);
    }
    .snu-program:hover::before { opacity: 1; }
    .snu-program-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .snu-program-index {
      font-size: 11px; font-weight: 600; letter-spacing: .12em;
      color: var(--snu-navy);
      opacity: .55;
    }
    .snu-program-title {
      font-size: 18px; font-weight: 700; letter-spacing: -0.005em;
      color: var(--snu-ink);
      margin: 0;
      line-height: 1.3;
    }
    .snu-program-desc {
      font-size: 13px; color: var(--snu-ink-3);
      line-height: 1.5;
      margin: 0;
    }
    .snu-program-stats {
      display: flex; gap: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--snu-line);
    }
    .snu-program-stat { }
    .snu-program-stat .n {
      font-size: 22px; font-weight: 700;
      color: var(--snu-ink);
      font-variant-numeric: tabular-nums;
    }
    .snu-program-stat .l {
      font-size: 11px; color: var(--snu-ink-3);
      text-transform: uppercase; letter-spacing: .06em;
      margin-top: 2px;
    }
    .snu-program-arrow {
      align-self: flex-end;
      color: var(--snu-navy);
      font-weight: 600;
      font-size: 13px;
      opacity: 0; transform: translateX(-4px);
      transition: opacity .18s, transform .18s;
    }
    .snu-program:hover .snu-program-arrow { opacity: 1; transform: translateX(0); }

    /* Events section: 2-column layout */
    .snu-events-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) { .snu-events-layout { grid-template-columns: 1fr; } }

    .snu-event-list {
      background: var(--snu-surface);
      border: 1px solid var(--snu-line);
      border-radius: 12px;
      overflow: hidden;
    }
    .snu-event-row {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: 20px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--snu-line);
      cursor: pointer;
      transition: background .12s;
      align-items: center;
    }
    .snu-event-row:last-child { border-bottom: none; }
    .snu-event-row:hover { background: var(--snu-surface-2); }
    .snu-event-date {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--snu-navy);
      font-weight: 600;
      line-height: 1.3;
    }
    .snu-event-date .y { display: block; font-size: 11px; color: var(--snu-ink-3); font-weight: 500; margin-top: 2px; letter-spacing: .04em; }
    .snu-event-name { font-size: 15px; font-weight: 600; color: var(--snu-ink); margin: 0 0 4px; }
    .snu-event-meta { font-size: 12px; color: var(--snu-ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
    .snu-event-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--snu-navy);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .snu-event-count {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .snu-event-count .n { font-size: 22px; font-weight: 700; color: var(--snu-navy); }
    .snu-event-count .l { font-size: 10px; color: var(--snu-ink-3); text-transform: uppercase; letter-spacing: .08em; }

    .snu-top-presenters {
      background: var(--snu-navy);
      color: #fff;
      border-radius: 12px;
      padding: 24px 26px;
      position: relative;
      overflow: hidden;
    }
    .snu-top-presenters::before {
      content: ""; position: absolute; top: -30%; right: -20%;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(212,160,23,.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .snu-top-title {
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--snu-gold-soft);
      margin: 0 0 18px;
      font-weight: 600;
      position: relative;
    }
    .snu-presenter {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      cursor: pointer;
      position: relative;
      transition: transform .12s;
    }
    .snu-presenter:last-child { border-bottom: none; }
    .snu-presenter:hover { transform: translateX(2px); }
    .snu-presenter .rank {
      font-size: 12px; font-weight: 700;
      color: var(--snu-gold-soft);
      font-variant-numeric: tabular-nums;
      opacity: .8;
    }
    .snu-presenter .info .name { font-size: 14px; font-weight: 600; }
    .snu-presenter .info .org { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 2px; }
    .snu-presenter .count {
      font-size: 13px; font-weight: 700;
      color: var(--snu-gold-soft);
      font-variant-numeric: tabular-nums;
    }
    .snu-presenter .count .u { font-size: 10px; font-weight: 400; color: rgba(255,255,255,.55); margin-left: 2px; }

    /* CTA card at bottom */
    .snu-cta {
      background: linear-gradient(135deg, var(--snu-navy) 0%, var(--snu-navy-2) 100%);
      color: #fff;
      border-radius: 14px;
      padding: 32px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      position: relative;
      overflow: hidden;
    }
    .snu-cta::before {
      content: "";
      position: absolute; right: -60px; top: 50%;
      width: 240px; height: 240px;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(212,160,23,.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .snu-cta:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(0,48,87,.20); }
    .snu-cta-text h3 {
      margin: 0 0 6px;
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.01em;
    }
    .snu-cta-text p {
      margin: 0;
      font-size: 14px;
      color: rgba(255,255,255,.75);
      max-width: 520px;
    }
    .snu-cta-text .highlight {
      color: var(--snu-gold-soft);
      font-weight: 700;
    }
    .snu-cta-action {
      flex-shrink: 0;
      background: var(--snu-gold);
      color: var(--snu-navy-2);
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }

    /* Two-column donut/detail row */
    .snu-detail-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) { .snu-detail-row { grid-template-columns: 1fr; } }
    .snu-panel {
      background: var(--snu-surface);
      border: 1px solid var(--snu-line);
      border-radius: 12px;
      padding: 24px 26px;
    }
    .snu-panel-title {
      font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--snu-ink-3);
      margin: 0 0 18px;
      font-weight: 600;
    }
    .snu-donut-flex { display: flex; align-items: center; gap: 28px; }
    .snu-donut-legend { flex: 1; }
    .snu-donut-legend .item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--snu-line);
      font-size: 13px;
    }
    .snu-donut-legend .item:last-child { border-bottom: none; }
    .snu-donut-legend .sw { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .snu-donut-legend .lbl { flex: 1; color: var(--snu-ink); }
    .snu-donut-legend .n { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--snu-ink); }
    .snu-donut-legend .p { color: var(--snu-ink-3); margin-left: 8px; font-size: 12px; }

    /* Calendar popup */
    dialog.snu-modal {
      background: var(--bg-card);
      color: inherit;
      border: none;
      border-radius: var(--r-md, 10px);
      padding: 24px;
      max-width: 760px;
      width: 92vw;
      max-height: 85vh;
      overflow: auto;
      box-shadow: var(--shadow-card);
    }
    dialog.snu-modal::backdrop { background: rgba(0,0,0,.6); }
    .snu-modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .snu-modal-head h3 { margin: 0; font-size: 18px; font-weight: 700; }
    .snu-modal-close {
      background: none; border: none; color: inherit;
      font-size: 20px; line-height: 1; cursor: pointer; opacity: .6; padding: 4px;
    }
    .snu-modal-close:hover { opacity: 1; }

    /* AI agent chat widget */
    #ai-agent-fab {
      position: fixed; right: 24px; bottom: 24px; z-index: 40;
      width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--brand-500), var(--accent-purple));
      color: #fff; font-size: 24px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    #ai-agent-modal { max-width: 440px; display: flex; flex-direction: column; }
    #ai-agent-log { max-height: 46vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .ai-msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 88%; white-space: pre-wrap; }
    .ai-msg-user { align-self: flex-end; background: var(--brand-500); color: #fff; }
    .ai-msg-bot { align-self: flex-start; background: var(--bg-card-light); }
    .ai-msg-error { align-self: flex-start; background: rgba(239,68,68,.15); color: #fca5a5; }
    .ai-proposal { border: 1px solid var(--ink-300); border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
    .ai-proposal-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .ai-proposal-row .k { color: var(--ink-300); }
    .ai-agent-row { display: flex; gap: 8px; }
    .ai-agent-row .form-input { flex: 1; }
    #ai-agent-file-label { display: flex; align-items: center; justify-content: center; width: 42px; cursor: pointer; }

    /* Newsletter popularity bars */
    .snu-hbar-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 13px; }
    .snu-hbar-row .lbl { width: 100px; flex-shrink: 0; color: var(--snu-ink-3); }
    .snu-hbar-row .bar { flex: 1; height: 8px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
    .snu-hbar-row .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-500), var(--accent-gold)); border-radius: 4px; }
    .snu-hbar-row .n { width: 28px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    @media (prefers-reduced-motion: no-preference) {
      .snu-hero-inner > * { animation: snu-fade-in .5s ease both; }
      .snu-hero .snu-eyebrow { animation-delay: .04s; }
      .snu-hero h1 { animation-delay: .12s; }
      .snu-hero .snu-lead { animation-delay: .18s; }
      .snu-pipeline { animation-delay: .24s; }
      .snu-hero-ctas { animation-delay: .32s; }
      @keyframes snu-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    /* ---- Calendar section ---- */
    .snu-cal-scroller {
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      scroll-behavior: smooth;
      /* Hide scrollbar for a cleaner look but keep it usable. */
      scrollbar-width: thin;
      scrollbar-color: var(--snu-line-2) transparent;
    }
    .snu-cal-scroller::-webkit-scrollbar { height: 8px; }
    .snu-cal-scroller::-webkit-scrollbar-thumb { background: var(--snu-line-2); border-radius: 4px; }
    .snu-cal-scroller::-webkit-scrollbar-track { background: transparent; }

    .snu-cal-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 260px;
      gap: 16px;
      align-items: stretch;
    }
    .snu-cal-month-group {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 260px;
      gap: 16px;
    }

    .snu-cal-month-label {
      position: sticky; left: 0;
      display: flex; align-items: center; justify-content: center;
      min-width: 68px;
      background: var(--snu-surface);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 11px; font-weight: 700;
      color: var(--snu-navy);
      letter-spacing: .18em;
      text-transform: uppercase;
      border-right: 1px solid var(--snu-line);
      padding: 4px 0;
    }

    .snu-cal-card {
      background: var(--snu-surface);
      border: 1px solid var(--snu-line);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: transform .18s, border-color .18s, box-shadow .18s;
      position: relative;
      min-height: 200px;
    }
    .snu-cal-card:hover {
      transform: translateY(-2px);
      border-color: var(--snu-navy);
      box-shadow: 0 10px 24px rgba(0,48,87,.10);
    }
    .snu-cal-card.past {
      background: var(--snu-surface-2);
      opacity: .82;
    }
    .snu-cal-card.upcoming::before {
      content: "";
      position: absolute; top: 12px; right: 12px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--snu-gold);
      box-shadow: 0 0 0 3px rgba(212,160,23,.20);
    }
    .snu-cal-date-block {
      display: flex; align-items: baseline; gap: 8px;
      font-variant-numeric: tabular-nums;
    }
    .snu-cal-date-block .day {
      font-size: 32px; font-weight: 700; color: var(--snu-navy); line-height: 1;
    }
    .snu-cal-date-block .rest {
      font-size: 12px; color: var(--snu-ink-3); letter-spacing: .04em;
    }
    .snu-cal-type {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--snu-navy);
      color: #fff;
      font-size: 10px; font-weight: 700;
      letter-spacing: .06em;
      align-self: flex-start;
    }
    .snu-cal-name {
      font-size: 14px; font-weight: 600;
      color: var(--snu-ink);
      line-height: 1.35;
      /* Clamp to 2 lines */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .snu-cal-loc {
      font-size: 12px;
      color: var(--snu-ink-3);
      margin-top: auto;
      display: flex; align-items: center; gap: 4px;
    }
    .snu-cal-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--snu-line);
      font-size: 11px;
    }
    .snu-cal-footer .n {
      font-weight: 700; color: var(--snu-navy);
      font-variant-numeric: tabular-nums;
    }
    .snu-cal-empty {
      background: var(--snu-surface);
      border: 1px dashed var(--snu-line-2);
      border-radius: 12px;
      padding: 44px 24px;
      text-align: center;
      color: var(--snu-ink-3);
    }
    .snu-cal-empty p { margin: 0 0 14px; font-size: 14px; }

    /* Divider between month groups (subtle) */
    .snu-cal-month-divider {
      width: 1px;
      background: var(--snu-line);
      margin: 8px 4px;
      align-self: stretch;
    }
    .snu-cal-today-line {
      width: 2px;
      background: linear-gradient(180deg, var(--snu-gold) 0%, var(--snu-gold-soft) 100%);
      margin: 8px 4px;
      align-self: stretch;
      position: relative;
      border-radius: 2px;
    }
    .snu-cal-today-line::before {
      content: "TODAY";
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%) rotate(-90deg);
      transform-origin: center;
      font-size: 9px; font-weight: 800;
      letter-spacing: .18em;
      color: var(--snu-gold);
      white-space: nowrap;
      background: var(--snu-surface);
      padding: 2px 6px;
      border-radius: 3px;
      margin-top: 24px;
    }

    /* ---- Popover for calendar card ---- */
    .snu-popover-backdrop {
      position: fixed; inset: 0;
      background: rgba(3, 20, 40, .35);
      z-index: 900;
      opacity: 0; pointer-events: none;
      transition: opacity .18s;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .snu-popover-backdrop.open { opacity: 1; pointer-events: auto; }

    .snu-popover {
      position: fixed;
      z-index: 901;
      background: var(--snu-surface);
      border-radius: 14px;
      box-shadow: 0 24px 56px rgba(0,20,40,.25);
      width: min(440px, calc(100vw - 32px));
      overflow: hidden;
      opacity: 0; transform: translateY(6px) scale(.98);
      transition: opacity .18s, transform .18s;
      pointer-events: none;
    }
    .snu-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .snu-popover-header {
      background: linear-gradient(135deg, var(--snu-navy) 0%, var(--snu-navy-2) 100%);
      color: #fff;
      padding: 20px 24px 16px;
      position: relative;
    }
    .snu-popover-header .type-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--snu-gold);
      color: var(--snu-navy-2);
      font-size: 10px; font-weight: 700;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .snu-popover-header h3 {
      margin: 0 0 6px;
      font-size: 18px; font-weight: 700;
      line-height: 1.3;
    }
    .snu-popover-header .meta {
      font-size: 12px;
      color: rgba(255,255,255,.72);
      font-variant-numeric: tabular-nums;
    }
    .snu-popover-close {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255,255,255,.12);
      color: #fff;
      width: 28px; height: 28px;
      border: none; border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .snu-popover-close:hover { background: rgba(255,255,255,.22); }
    .snu-popover-body {
      padding: 18px 24px 22px;
    }
    .snu-popover-body .field {
      display: flex; gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }
    .snu-popover-body .field .k {
      color: var(--snu-ink-3);
      min-width: 60px;
      font-size: 12px;
    }
    .snu-popover-body .field .v {
      color: var(--snu-ink);
      flex: 1;
      word-break: break-word;
    }
    .snu-popover-desc {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--snu-line);
      font-size: 13px;
      color: var(--snu-ink-2);
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .snu-popover-actions {
      display: flex; gap: 10px;
      padding: 12px 24px 20px;
      justify-content: flex-end;
      background: var(--snu-surface-2);
      border-top: 1px solid var(--snu-line);
    }
  </style></style>

<body>
  <div id="loading" class="gs-empty" style="min-height:60vh">로딩 중…</div>
  <div id="error" class="gs-empty" style="display:none;color:var(--danger-500)"></div>
  <div id="root" class="gs-wrap" style="display:none"></div>
  <div id="toast" class="toast"></div>

  <!-- AI 관리자 챗봇 (베타) -->
  <button id="ai-agent-fab" aria-label="AI 관리자 챗봇 열기">🤖</button>
  <dialog class="snu-modal" id="ai-agent-modal">
    <div class="snu-modal-head">
      <h3>🤖 AI 관리자 (베타)</h3>
      <button class="snu-modal-close" id="ai-agent-close" aria-label="닫기">✕</button>
    </div>
    <p class="t-body" style="margin:0 0 12px; font-size:12px">
      자연어로 회원 정보 수정을 요청하거나, 합격서·지원서 파일을 올리면 AI가 대상을 찾아 변경안을 제안합니다.
      실제 DB에는 <b>확인 버튼을 눌러야</b> 반영됩니다.
    </p>
    <div id="ai-agent-log"></div>
    <div id="ai-agent-proposal"></div>
    <div class="ai-agent-row">
      <input type="text" id="ai-agent-input" class="form-input" placeholder="예: 강성규 협의회 가입완료로 바꿔줘">
      <label id="ai-agent-file-label" class="btn" title="파일 첨부 (PDF/이미지)">
        📎<input type="file" id="ai-agent-file" accept=".pdf,image/*" style="display:none">
      </label>
      <button class="btn btn-primary" id="ai-agent-send">전송</button>
    </div>
  </dialog>

  <script>
    // ============================================================
    // Supabase 클라이언트 초기화 + AgentDB Bridge 어댑터
    //
    // 원래 window.agentdb.executeQuery('name', params) 로 호출하던 것을
    // Supabase RPC (Postgres 함수) 호출로 변환합니다.
    // ============================================================
    const SB_URL = window.__SUPABASE_URL__ || 'YOUR_SUPABASE_URL';
    const SB_KEY = window.__SUPABASE_ANON_KEY__ || 'YOUR_SUPABASE_ANON_KEY';
    const sb = window.supabase.createClient(SB_URL, SB_KEY);

    // Bridge adapter: mimics window.agentdb.executeQuery()
    window.agentdb = {
      async executeQuery(name, params = {}) {
        // Handle INSERT queries directly (create_event, create_presentation)
        if (name === 'create_event') {
          const { data, error } = await sb.from('events').insert([{
            name: params.name, event_type: params.event_type, edition: params.edition,
            start_date: params.start_date || null, end_date: params.end_date || null,
            location: params.location, theme: params.theme,
            status: params.status, description: params.description
          }]).select('id, name');
          if (error) throw new Error(error.message);
          return { rows: data, row_count: data.length };
        }
        if (name === 'create_presentation') {
          const { data, error } = await sb.from('event_presentations').insert([{
            event_id: params.event_id, person_id: params.person_id,
            presenter_name_snapshot: params.presenter_name_snapshot,
            title: params.title, topic: params.topic, session_type: params.session_type,
            session_date: params.session_date || null, session_time: params.session_time,
            abstract: params.abstract, status: params.status
          }]).select('id, title');
          if (error) throw new Error(error.message);
          return { rows: data, row_count: data.length };
        }
        if (name === 'update_person') {
          const { data, error } = await sb.from('people').update({
            position: params.position, department: params.department,
            email: params.email, phone: params.phone, expertise: params.expertise,
          }).eq('id', params.person_id).select('id');
          if (error) throw new Error(error.message);
          return { rows: data, row_count: data.length };
        }
        if (name === 'update_wftc_membership') {
          const { data, error } = await sb.from('wftc_memberships').upsert({
            person_id: params.person_id, membership_status: params.membership_status,
            membership_tier: params.membership_tier, member_type: params.member_type,
            join_date: params.join_date || null,
          }, { onConflict: 'person_id' }).select('id');
          if (error) throw new Error(error.message);
          return { rows: data, row_count: data.length };
        }
        // For all other named queries, call the Postgres function via RPC.
        // Parameter names must match the function signature.
        const { data, error } = await sb.rpc(name, params);
        if (error) throw new Error(error.message);
        const rows = Array.isArray(data) ? data : [data];
        return { rows: rows, row_count: rows.length, columns: rows.length > 0 ? Object.keys(rows[0]) : [] };
      }
    };

    // gsDash utility functions (formerly injected by AgentDB)
    window.gsDash = {
      fmtInt(n) {
        if (n == null || isNaN(n)) return '0';
        return Number(n).toLocaleString('ko-KR');
      },
      fmtMoney(n) {
        if (n == null) return '';
        return '₩' + Number(n).toLocaleString('ko-KR');
      },
      humanize(s) {
        if (!s) return '';
        return String(s).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      },
      relTime(d) {
        if (!d) return '';
        const dt = new Date(d);
        const diff = (Date.now() - dt.getTime()) / 1000;
        if (diff < 60) return '방금';
        if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
        if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
        return `${Math.floor(diff/86400)}일 전`;
      },
      dateMD(d) {
        if (!d) return '';
        const dt = new Date(d);
        return `${dt.getMonth()+1}/${dt.getDate()}`;
      },
      esc(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      },
      vizColor(i) {
        const palette = ['#005cb9', '#0073e6', '#5a7a9a', '#8ba3bd', '#c2ceda', '#4a5568'];
        return palette[i % palette.length];
      },
      tag(text, tone) {
        const cls = 'gs-tag gs-tag-' + (tone || 'neutral');
        return `<span class="${cls}">${this.esc(text)}</span>`;
      },
      statusTone(label) {
        if (['진행중','확정','완료','성공','active','success'].includes(label)) return 'success';
        if (['취소','실패','danger','error'].includes(label)) return 'danger';
        if (['준비중','대기','pending','warn'].includes(label)) return 'warn';
        return 'neutral';
      },
      panels(cardArr, cols) {
        const c = cols || cardArr.length;
        return `<div style="display:grid; grid-template-columns: repeat(${c}, 1fr); gap:16px">${cardArr.join('')}</div>`;
      },
      barCard({title, sub, rows, xFmt}) {
        if (!rows || rows.length === 0) {
          return this._card(title, sub, '<div class="gs-empty">데이터 없음</div>');
        }
        const max = Math.max(1, ...rows.map(r => r.value));
        const fmt = xFmt || (v => this.fmtInt(v));
        const body = rows.map(r => {
          const pct = Math.round(r.value / max * 100);
          return `
            <div style="margin-bottom:12px">
              <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:13px">
                <span>${this.esc(r.label)}</span>
                <span style="font-weight:600; font-variant-numeric:tabular-nums">${fmt(r.value)}</span>
              </div>
              <div style="height:6px; background:var(--ink-100); border-radius:3px; overflow:hidden">
                <div style="height:100%; width:${pct}%; background:var(--brand-500); border-radius:3px"></div>
              </div>
            </div>
          `;
        }).join('');
        return this._card(title, sub, body);
      },
      donutCard({title, sub, rows, fmt}) {
        if (!rows || rows.length === 0) {
          return this._card(title, sub, '<div class="gs-empty">데이터 없음</div>');
        }
        const total = rows.reduce((s, r) => s + Number(r.value), 0) || 1;
        const fmtFn = fmt || (v => this.fmtInt(v));
        let offset = 0;
        const cx = 60, cy = 60, r = 45, sw = 18;
        const circ = 2 * Math.PI * r;
        const segs = rows.map((row, i) => {
          const len = row.value / total * circ;
          const s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${this.vizColor(i)}" stroke-width="${sw}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
          offset += len;
          return s;
        }).join('');
        const legend = rows.map((row, i) => `
          <div style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px">
            <div style="width:10px; height:10px; border-radius:2px; background:${this.vizColor(i)}"></div>
            <div style="flex:1">${this.esc(row.label)}</div>
            <div style="font-weight:600; font-variant-numeric:tabular-nums">${fmtFn(row.value)}</div>
            <div style="color:var(--ink-500); font-size:11px">${Math.round(row.value/total*100)}%</div>
          </div>
        `).join('');
        return this._card(title, sub, `
          <div style="display:flex; gap:16px; align-items:center">
            <svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0">${segs}</svg>
            <div style="flex:1">${legend}</div>
          </div>
        `);
      },
      feedCard({title, sub, rows, empty}) {
        if (!rows || rows.length === 0) {
          return this._card(title, sub, `<div class="gs-empty" style="color:var(--ink-500)">${empty || '데이터 없음'}</div>`);
        }
        const body = rows.map(r => `
          <div style="display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--ink-050); font-size:13px">
            <div style="width:28px; height:28px; border-radius:50%; background:var(--brand-500); color:white; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0">${this.esc(r.initial || '?')}</div>
            <div style="flex:1; min-width:0">
              <div style="font-weight:500">${this.esc(r.main || '')}</div>
              ${r.sub ? `<div style="font-size:11px; color:var(--ink-500); margin-top:2px">${this.esc(r.sub)}</div>` : ''}
            </div>
            ${r.meta ? `<div style="font-size:11px; color:var(--ink-500); display:flex; align-items:center; gap:6px">${r.meta}</div>` : ''}
          </div>
        `).join('');
        return this._card(title, sub, body);
      },
      _card(title, sub, bodyHTML) {
        return `
          <div style="background:var(--bg-card); border-radius:var(--r-md); padding:18px 20px; box-shadow:var(--shadow-card)">
            <div style="font-size:12px; font-weight:600; color:var(--ink-700); letter-spacing:.04em; margin-bottom:${sub ? '4px' : '14px'}">${this.esc(title || '')}</div>
            ${sub ? `<div style="font-size:11px; color:var(--ink-500); margin-bottom:14px">${this.esc(sub)}</div>` : ''}
            ${bodyHTML}
          </div>
        `;
      },
      kpiRow(items) {
        return `<div class="gs-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px">${
          items.map(it => `
            <div style="padding:16px 18px; background:var(--bg-card); border-radius:var(--r-md); box-shadow:var(--shadow-card)">
              <div style="font-size:11px; color:var(--ink-500); margin-bottom:6px">${this.esc(it.label)}</div>
              <div style="font-size:24px; font-weight:600; color:${it.accent==='good'?'var(--success-500)':it.accent==='alert'?'var(--warn-500)':'var(--ink-900)'}; font-variant-numeric:tabular-nums">${this.fmtInt(it.value)}</div>
              ${it.sub ? `<div style="font-size:12px; color:var(--ink-500); margin-top:2px">${this.esc(it.sub)}</div>` : ''}
            </div>
          `).join('')
        }</div>`;
      }
    };

    var g = window.gsDash;

    // ---------- Utility ----------
    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function statusPill(status) {
      if (status === '가입 완료') return `<span class="status-pill status-joined">가입 완료</span>`;
      if (status === '미가입') return `<span class="status-pill status-none">미가입</span>`;
      return `<span class="status-pill status-pending">${esc(status)}</span>`;
    }
    function eventStatusPill(status) {
      const cls = status === '종료' ? 'status-done'
        : status === '취소' ? 'status-cancelled'
        : (status === '진행중' || status === '준비중') ? 'status-scheduled'
        : 'status-none';
      return `<span class="status-pill ${cls}">${esc(status || '')}</span>`;
    }
    function eventTypeBadge(type) {
      return `<span class="status-pill status-none">${esc(type || '')}</span>`;
    }
    function fmtDate(d) {
      if (!d) return '';
      try {
        const dt = new Date(d);
        if (isNaN(dt)) return String(d);
        return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
      } catch { return String(d); }
    }
    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const errEl = document.getElementById('error');
      errEl.replaceChildren();
      const text = document.createElement('div');
      text.textContent = '오류: ' + msg;
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = '다시 시도';
      btn.onclick = () => { errEl.style.display = 'none'; document.getElementById('loading').style.display = 'block'; renderRoute(); };
      errEl.append(text, btn);
      errEl.style.display = 'flex';
    }
    function showRoot() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('root').style.display = 'block';
    }
    function toast(msg, kind) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (kind || '');
      clearTimeout(t.__hideTimer);
      t.__hideTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    // ---------- Router ----------
    var route = { view: 'dashboard', params: {} };
    function navigate(view, params) {
      route = { view: view, params: params || {} };
      window.scrollTo(0, 0);
      renderRoute();
    }
    window.__nav = navigate;

    async function renderRoute() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('root').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      // Root layout mode: dashboard = full-bleed hero; other views = padded wrap.
      const rootEl = document.getElementById('root');
      if (route.view === 'dashboard') {
        rootEl.classList.add('root-fullbleed');
      } else {
        rootEl.classList.remove('root-fullbleed');
      }
      try {
        const v = route.view;
        if (v === 'dashboard') await renderDashboard();
        else if (v === 'programs') await renderProgramsIndex();
        else if (v === 'program') await renderProgramDetail(route.params.program);
        else if (v === 'wftc') await renderWftcList(route.params.status);
        else if (v === 'people') await renderPeopleList();
        else if (v === 'person') await renderPersonDetail(route.params.person_id);
        else if (v === 'non_members') await renderNonMembers();
        else if (v === 'events') await renderEventsList();
        else if (v === 'event') await renderEventDetail(route.params.event_id);
        else if (v === 'event_new') await renderEventForm();
        else if (v === 'presentation_new') await renderPresentationForm(route.params.event_id, route.params.person_id);
        else await renderDashboard();
        showRoot();
      } catch (e) {
        console.error('[error]', e);
        showError(e.message || String(e));
      }
    }

    function breadcrumb(items) {
      const html = items.map((it, i) => {
        const isLast = i === items.length - 1;
        if (isLast) return `<span>${esc(it.label)}</span>`;
        const p = JSON.stringify(it.params || {}).replace(/"/g, '&quot;');
        return `<a onclick="__nav('${it.view}', ${p})">${esc(it.label)}</a><span class="sep">›</span>`;
      }).join('');
      return `<div class="breadcrumb">${html}</div>`;
    }

    function kpiTile(label, value, sub, onclick, accent) {
      const accentColor = accent === 'good' ? 'var(--success-500)' : accent === 'alert' ? 'var(--warn-500)' : accent === 'brand' ? 'var(--brand-500)' : 'var(--ink-700)';
      const handler = onclick.toString().replace(/^\(\) => /, '');
      return `
        <div class="clickable" onclick="${handler}"
          style="padding:16px 18px; background:var(--bg-card,#fff); border-radius:var(--r-md,8px); box-shadow:var(--shadow-card)">
          <div class="t-micro" style="color:var(--ink-500); margin-bottom:6px">${esc(label)}</div>
          <div style="font-size:26px; font-weight:600; color:${accentColor}; font-variant-numeric:tabular-nums">${g.fmtInt(value)}</div>
          ${sub ? `<div class="t-small" style="color:var(--ink-500); margin-top:2px">${esc(sub)}</div>` : ''}
        </div>
      `;
    }

    // ---------- View: Dashboard ----------
    async function renderDashboard() {
      const [kpiRes, wftcRes, funnelRes, progRes, evKpiRes, evListRes, evTypeRes, topPresRes, calRes, peopleRes] = await Promise.all([
        window.agentdb.executeQuery('summary_kpis', {}),
        window.agentdb.executeQuery('wftc_status_breakdown', {}),
        window.agentdb.executeQuery('enrollment_to_wftc_funnel', {}),
        window.agentdb.executeQuery('programs_summary', {}),
        window.agentdb.executeQuery('events_kpis', {}),
        window.agentdb.executeQuery('events_list', { status_filter: null, type_filter: null }),
        window.agentdb.executeQuery('events_by_type', {}),
        window.agentdb.executeQuery('top_presenters', {}),
        window.agentdb.executeQuery('events_calendar_window', {}),
        window.agentdb.executeQuery('people_list', {}),
      ]);
      const k = kpiRes.rows[0] || {};
      const f = funnelRes.rows[0] || {};
      const ek = evKpiRes.rows[0] || {};

      // 사람별 참여 교육과정 개수 순위 (programs 컬럼은 "과정명, 과정명" 콤마 구분 문자열)
      const topProgramParticipants = peopleRes.rows
        .map(p => ({ name: p.name, person_id: p.person_id, programs: p.programs || '', count: p.programs ? p.programs.split(',').length : 0 }))
        .filter(p => p.count > 0)
        .sort((a, b) => b.count - a.count)
        .slice(0, 10);

      const totalPeople = Number(k.total_people) || 0;
      const joined = Number(k.wftc_members) || 0;
      const nonMemberCount = totalPeople - joined;
      const conversionPct = totalPeople > 0 ? Math.round(joined / totalPeople * 100) : 0;

      // Funnel stages — normalize to max for the bar width
      const stages = [
        { label: '전체 수강생', value: Number(f.enrolled_total || 0), key: 'enrolled' },
        { label: '가입 권유 중', value: Number(f.invited || 0), key: 'invited' },
        { label: '가입 신청',   value: Number(f.applied || 0), key: 'applied' },
        { label: '가입 완료',   value: Number(f.joined || 0), key: 'joined' },
      ];
      const stageMax = Math.max(1, ...stages.map(s => s.value));

      const root = document.getElementById('root');
      root.innerHTML = `
        <div class="snu-hero-page">
          <!-- HERO -->
          <section class="snu-hero">
            <div class="snu-hero-inner">
              <div class="snu-eyebrow">SNU FoodTech · WFTC</div>
              <h1 class="snu-headline">
                World FoodTech Database
              </h1>

              <div class="snu-pipeline">
                <div class="snu-pipeline-title">가입 파이프라인</div>
                <div class="snu-pipeline-row">
                  ${stages.map((s, i) => `
                    <div class="snu-stage ${i === stages.length - 1 ? 'final' : ''}">
                      <div class="snu-stage-label">${esc(s.label)}</div>
                      <div class="snu-stage-value">${g.fmtInt(s.value)}<span class="unit">명</span></div>
                      <div class="snu-stage-bar"><span style="width:${Math.round(s.value / stageMax * 100)}%"></span></div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="snu-hero-ctas">
                <button class="snu-btn snu-btn-primary snu-btn-arrow" data-nav="non_members">
                  미가입 대상 ${g.fmtInt(nonMemberCount)}명
                </button>
                <button class="snu-btn snu-btn-ghost" data-nav="wftc" data-status="가입 완료">
                  가입 회원 보기
                </button>
              </div>
            </div>
          </section>

          <!-- CONTENT -->
          <div class="snu-content">

            <!-- Distribution snapshot (참고용 요약 도형, 맨 위 배치) -->
            <section class="snu-section">
              <div class="snu-detail-row">
                <div class="snu-panel">
                  <div class="snu-panel-title">WFTC 가입 현황</div>
                  <div id="snu-wftc-donut"></div>
                </div>
                <div class="snu-panel">
                  <div class="snu-panel-title">행사 유형</div>
                  <div id="snu-event-types"></div>
                </div>
              </div>
            </section>

            <!-- Section 1: Overview -->
            <section class="snu-section">
              <div class="snu-section-head">
                <div>
                  <h2 class="snu-section-title"><span class="num">01</span>Overview</h2>
                  <p class="snu-section-sub">관리 인원 및 활동 현황</p>
                </div>
              </div>
              <div class="snu-stat-grid">
                <div class="snu-stat" data-nav="people">
                  <div class="snu-stat-label">전체 인원</div>
                  <div class="snu-stat-value">${g.fmtInt(totalPeople)}</div>
                  <div class="snu-stat-sub">임원·학생·교수·강사·회원</div>
                </div>
                <div class="snu-stat" data-nav="wftc" data-status="가입 완료">
                  <div class="snu-stat-label">WFTC 회원</div>
                  <div class="snu-stat-value">${g.fmtInt(joined)}<span style="font-size:14px; color:var(--snu-ink-3); font-weight:400; margin-left:6px">${conversionPct}%</span></div>
                  <div class="snu-stat-sub">전체 대비 가입률</div>
                </div>
                <div class="snu-stat" data-nav="programs">
                  <div class="snu-stat-label">수강 이력</div>
                  <div class="snu-stat-value">${g.fmtInt(k.total_enrollments)}</div>
                  <div class="snu-stat-sub">누적 건수</div>
                </div>

    // Custom donut renderer using SVG — matches SNU palette
    function renderSnuDonut(elementId, rows) {
      const total = rows.reduce((s, r) => s + r.value, 0) || 1;
      const colors = ['#005cb9', '#0073e6', '#5a7a9a', '#8ba3bd', '#c2ceda'];
      const cx = 90, cy = 90, r = 70, strokeW = 26;
      const circ = 2 * Math.PI * r;

      let offset = 0;
      const segments = rows.map((row, i) => {
        const pct = row.value / total;
        const len = pct * circ;
        const seg = `
          <circle cx="${cx}" cy="${cy}" r="${r}"
            fill="none" stroke="${colors[i % colors.length]}"
            stroke-width="${strokeW}"
            stroke-dasharray="${len} ${circ - len}"
            stroke-dashoffset="${-offset}"
            transform="rotate(-90 ${cx} ${cy})" />
        `;
        offset += len;
        return seg;
      }).join('');

      const legend = rows.map((row, i) => `
        <div class="item">
          <div class="sw" style="background:${colors[i % colors.length]}"></div>
          <div class="lbl">${esc(row.label)}</div>
          <div class="n">${window.gsDash.fmtInt(row.value)}</div>
          <div class="p">${Math.round(row.value / total * 100)}%</div>
        </div>
      `).join('');

      document.getElementById(elementId).innerHTML = `
        <div class="snu-donut-flex">
          <svg width="180" height="180" viewBox="0 0 180 180" style="flex-shrink:0">
            ${segments}
            <text x="90" y="86" text-anchor="middle" style="font-size:26px; font-weight:700; fill:var(--snu-ink); font-variant-numeric:tabular-nums">${window.gsDash.fmtInt(total)}</text>
            <text x="90" y="106" text-anchor="middle" style="font-size:11px; fill:var(--snu-ink-3); letter-spacing:.08em">TOTAL</text>
          </svg>
          <div class="snu-donut-legend">${legend}</div>
        </div>
      `;
    }

    // Custom horizontal bar renderer — SNU palette
    function renderSnuHBar(elementId, rows) {
      const max = Math.max(1, ...rows.map(r => r.value));
      const html = rows.map(r => {
        const pct = Math.round(r.value / max * 100);
        return `
          <div style="margin-bottom:14px">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px">
              <span style="color:var(--snu-ink)">${esc(r.label)}</span>
              <span style="color:var(--snu-ink); font-weight:600; font-variant-numeric:tabular-nums">${window.gsDash.fmtInt(r.value)}건</span>
            </div>
            <div style="height:6px; background:var(--snu-line); border-radius:3px; overflow:hidden">
              <div style="height:100%; width:${pct}%; background:linear-gradient(90deg, var(--snu-navy), var(--snu-gold)); border-radius:3px; transition:width .6s"></div>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById(elementId).innerHTML = html;
    }

    // ============= Calendar (3-month window) =============
    function renderSnuCalendar(elementId, rows) {
      const container = document.getElementById(elementId);
      if (!container) return;

      if (rows.length === 0) {
        container.innerHTML = `
          <div class="snu-cal-empty">
            <p>오늘 기준 앞뒤 3개월 안에 예정된 행사가 없습니다.</p>
            <button class="snu-btn snu-btn-primary" data-nav="event_new">+ 행사 등록</button>
          </div>
        `;
        // Wire the button
        container.querySelector('[data-nav]')?.addEventListener('click', (e) => {
          e.stopPropagation();
          __nav('event_new');
        });
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayISO = today.toISOString().slice(0, 10);

      // Group events by year-month
      const groups = new Map(); // "YYYY-MM" -> [events]
      rows.forEach(r => {
        const d = new Date(r.start_date);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      });
      const monthKeys = Array.from(groups.keys()).sort();

      // Find where "today" belongs so we can insert the today-line divider
      // Iterate months and events in order, remembering the position to inject.
      const cells = []; // each cell is HTML string
      let todayInserted = false;

      const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

      for (const mkey of monthKeys) {
        const [y, m] = mkey.split('-').map(Number);
        const monthLabel = `${y}. ${monthNames[m-1]}`;

        // Month label cell (single column, sticky-ish)
        cells.push(`<div class="snu-cal-month-label">${monthLabel}</div>`);

        const events = groups.get(mkey).sort((a, b) => new Date(a.start_date) - new Date(b.start_date));
        for (const e of events) {
          // If we haven't inserted today-line yet and this event is on/after today, insert it now.
          if (!todayInserted && e.start_date >= todayISO) {
            cells.push(`<div class="snu-cal-today-line" aria-label="today"></div>`);
            todayInserted = true;
          }
          cells.push(renderSnuCalendarCard(e, todayISO));
        }
      }

      // If today falls after all events in window, append at the end
      if (!todayInserted) {
        cells.push(`<div class="snu-cal-today-line" aria-label="today"></div>`);
      }

      container.innerHTML = `
        <div class="snu-cal-scroller">
          <div class="snu-cal-track">${cells.join('')}</div>
        </div>
      `;

      // Wire card clicks -> popover
      container.querySelectorAll('.snu-cal-card').forEach(card => {
        card.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const evId = Number(card.dataset.eventId);
          openEventPopover(evId, card);
        });
      });

      // Scroll to the today-line so upcoming events are visible on load
      requestAnimationFrame(() => {
        const scroller = container.querySelector('.snu-cal-scroller');
        const line = container.querySelector('.snu-cal-today-line');
        if (scroller && line) {
          const target = Math.max(0, line.offsetLeft - 80);
          scroller.scrollLeft = target;
        }
      });
    }

    function renderSnuCalendarCard(e, todayISO) {
      const d = new Date(e.start_date);
      const day = String(d.getDate()).padStart(2, '0');
      const dow = ['일','월','화','수','목','금','토'][d.getDay()];
      const monthShort = `${d.getMonth()+1}월`;
      const isPast = e.start_date < todayISO;
      const isUpcoming = e.start_date >= todayISO;

      const endStr = e.end_date && e.end_date !== e.start_date
        ? ` ~ ${new Date(e.end_date).getDate()}일` : '';

      return `
        <div class="snu-cal-card ${isPast ? 'past' : ''} ${isUpcoming ? 'upcoming' : ''}" data-event-id="${e.id}">
          <div class="snu-cal-date-block">
            <span class="day">${day}</span>
            <span class="rest">${monthShort} · ${dow}${endStr}</span>
          </div>
          <span class="snu-cal-type">${esc(e.event_type || '')}</span>
          <div class="snu-cal-name">${esc(e.name)}${e.edition ? ' · ' + esc(e.edition) : ''}</div>
          ${e.location ? `<div class="snu-cal-loc">${esc(e.location)}</div>` : ''}
          <div class="snu-cal-footer">
            <span style="color:var(--snu-ink-3)">${esc(e.status || '')}</span>
            <span><span class="n">${window.gsDash.fmtInt(e.presentation_count)}</span> 발표</span>
          </div>
        </div>
      `;
    }

    // ============= Popover for calendar card =============
    let popoverState = { open: false, eventId: null };

    async function openEventPopover(eventId, sourceEl) {
      // If clicking same card again while open — go to detail page.
      if (popoverState.open && popoverState.eventId === eventId) {
        closeEventPopover();
        __nav('event', { event_id: eventId });
        return;
      }
      // Different card / new open — fetch data first
      let data;
      try {
        const res = await window.agentdb.executeQuery('event_summary_popup', { event_id: eventId });
        data = res.rows[0];
      } catch (e) { console.error(e); return; }
      if (!data) return;

      ensurePopoverElements();
      const backdrop = document.getElementById('snu-popover-backdrop');
      const pop = document.getElementById('snu-popover');

      const startDate = fmtDate(data.start_date);
      const endDate = data.end_date && data.end_date !== data.start_date ? fmtDate(data.end_date) : null;
      const dateStr = endDate ? `${startDate} ~ ${endDate}` : startDate;

      pop.innerHTML = `
        <div class="snu-popover-header">
          <button class="snu-popover-close" aria-label="닫기">×</button>
          <div class="type-badge">${esc(data.event_type || '')}</div>
          <h3>${esc(data.name)}${data.edition ? ' · ' + esc(data.edition) : ''}</h3>
          <div class="meta">${esc(dateStr)}${data.location ? ' · ' + esc(data.location) : ''}</div>
        </div>
        <div class="snu-popover-body">
          <div class="field">
            <div class="k">상태</div>
            <div class="v">${esc(data.status || '')}</div>
          </div>
          ${data.theme ? `
            <div class="field">
              <div class="k">주제</div>
              <div class="v">${esc(data.theme)}</div>
            </div>
          ` : ''}
          <div class="field">
            <div class="k">발표</div>
            <div class="v"><b>${window.gsDash.fmtInt(data.presentation_count)}</b>건</div>
          </div>
          ${data.top_presenters ? `
            <div class="field">
              <div class="k">발표자</div>
              <div class="v" style="font-size:12px; color:var(--snu-ink-2)">${esc(data.top_presenters)}${data.presentation_count > 5 ? ' 외 ' + (data.presentation_count - 5) + '명' : ''}</div>
            </div>
          ` : ''}
          ${data.description ? `<div class="snu-popover-desc">${esc(data.description)}</div>` : ''}
        </div>
        <div class="snu-popover-actions">
          <button class="snu-btn snu-btn-ghost" id="snu-popover-cancel"
            style="color:var(--snu-ink); border-color:var(--snu-line-2); padding:8px 16px; font-size:13px">닫기</button>
          <button class="snu-btn snu-btn-primary" id="snu-popover-detail"
            style="padding:8px 18px; font-size:13px">상세 페이지 →</button>
        </div>
      `;

      // Position: center on screen for simplicity, works on mobile too
      pop.style.left = '50%';
      pop.style.top = '50%';
      pop.style.transform = 'translate(-50%, -50%) scale(.98)';

      backdrop.classList.add('open');
      pop.classList.add('open');
      // After adding .open, the transform gets overridden by CSS to remove scale;
      // but our inline transform wins. Adjust with a followup rAF to let CSS take over.
      requestAnimationFrame(() => {
        pop.style.transform = 'translate(-50%, -50%) scale(1)';
      });
      popoverState = { open: true, eventId };

      // Wire buttons
      pop.querySelector('.snu-popover-close').onclick = closeEventPopover;
      document.getElementById('snu-popover-cancel').onclick = closeEventPopover;
      document.getElementById('snu-popover-detail').onclick = () => {
        closeEventPopover();
        __nav('event', { event_id: eventId });
      };
    }

    function closeEventPopover() {
      const backdrop = document.getElementById('snu-popover-backdrop');
      const pop = document.getElementById('snu-popover');
      if (backdrop) backdrop.classList.remove('open');
      if (pop) pop.classList.remove('open');
      popoverState = { open: false, eventId: null };
    }

    function ensurePopoverElements() {
      if (document.getElementById('snu-popover')) return;
      const backdrop = document.createElement('div');
      backdrop.id = 'snu-popover-backdrop';
      backdrop.className = 'snu-popover-backdrop';
      backdrop.onclick = closeEventPopover;
      document.body.appendChild(backdrop);

      const pop = document.createElement('div');
      pop.id = 'snu-popover';
      pop.className = 'snu-popover';
      document.body.appendChild(pop);

      // ESC to close
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && popoverState.open) closeEventPopover();
      });
    }

    // ---------- View: Program Detail ----------
    async function renderProgramDetail(programName) {
      const res = await window.agentdb.executeQuery('program_detail', { program_name: programName });
      const rows = res.rows;
      const byCohort = {};
      for (const r of rows) {
        const key = r.cohort_name || '(기수 없음)';
        (byCohort[key] = byCohort[key] || []).push(r);
      }
      // Sort cohorts: student cohorts first (by numeric edition ascending), lecturer group last.
      function cohortSortKey(name) {
        if (name === '강사진 통합') return [2, 0, name]; // last group
        const m = String(name).match(/(\d+)/);
        const num = m ? parseInt(m[1], 10) : 999999;
        return [1, num, name];
      }
      const cohortNames = Object.keys(byCohort).sort((a, b) => {
        const ka = cohortSortKey(a), kb = cohortSortKey(b);
        if (ka[0] !== kb[0]) return ka[0] - kb[0];
        if (ka[1] !== kb[1]) return ka[1] - kb[1];
        return ka[2].localeCompare(kb[2]);
      });

      document.getElementById('root').innerHTML = `
        ${breadcrumb([
          {label: '대시보드', view: 'dashboard'},
          {label: '교육과정', view: 'programs'},

        ])}

        <p class="t-body" style="margin:0 0 20px">
          총 <b>${g.fmtInt(rows.length)}</b>건의 참여 기록 · <b>${cohortNames.length}</b>개 기수
        </p>
        <div class="filter-bar">
          <input type="text" placeholder="이름·소속·이메일 검색…" oninput="__filterTable('prog-table', this.value)">
          <span class="count-badge">${g.fmtInt(rows.length)}건</span>
        </div>
        ${cohortNames.map(cn => {
          const rs = byCohort[cn];
          return `
            <div class="cohort-header">
              <span>${esc(cn)}</span>
              <span class="badge">${g.fmtInt(rs.length)}명</span>
            </div>
            <div class="table-wrap">
              <table class="data-table" data-search-table="prog-table">
                <thead>
                  <tr>
                    <th>이름</th><th>역할</th><th>소속</th><th>직위</th>
                    <th>이메일</th><th>전화</th><th>협의회</th>
                  </tr>
                </thead>
                <tbody>
                  ${rs.map(r => `
                    <tr class="row-clickable" onclick="__nav('person', {person_id: ${r.person_id}})">
                      <td><b>${esc(r.person_name)}</b></td>
                      <td>${esc(r.role || '')}</td>
                      <td>${esc(r.organization || '')}</td>
                      <td>${esc(r.position || '')}</td>
                      <td>${esc(r.email || '')}</td>
                      <td>${esc(r.phone || '')}</td>
                      <td>${statusPill(r.wftc_status)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        }).join('')}
      `;
    }

    // ---------- Newsletter 참여도 실시간 연동 ----------
    async function loadNewsletterScores() {
      const statusEl = document.getElementById('newsletter-live-status');
      const listEl = document.getElementById('snu-newsletter-top10');
      if (!statusEl || !listEl) return; // 다른 화면으로 이동한 뒤 응답이 늦게 온 경우
      try {
        const res = await fetch('/api/newsletter-scores');
        const data = await res.json();
        if (data.error || !Array.isArray(data.rows)) throw new Error(data.error || '형식 오류');

        const rows = data.rows
          .map(r => ({ name: r['이름'], tier: r['등급'], score: Number(r['점수']) || 0 }))
          .filter(r => r.name)
          .sort((a, b) => b.score - a.score)
          .slice(0, 10);

        listEl.innerHTML = rows.map((r, i) => `
          <div class="snu-presenter">
            <div class="rank">${String(i + 1).padStart(2, '0')}</div>
            <div class="info">
              <div class="name">${esc(r.name)}</div>
              <div class="org">${esc(r.tier)}</div>
            </div>
            <div class="count">${r.score.toFixed(1)}<span class="u">점</span></div>
          </div>
        `).join('') || '<p style="color:rgba(255,255,255,.6); font-size:13px; margin:0">데이터가 없습니다</p>';

        statusEl.textContent = `뉴스레터 참여 현황 · 실시간 연동 · 총 ${data.rows.length}명`;
      } catch (e) {
        statusEl.textContent = '뉴스레터 참여 현황 · 실시간 연동 실패 — 최근 확인한 값(스냅샷) 표시 중';
        console.error('[newsletter-scores]', e);
      }
    }

          name: name,
          event_type: type,
          edition: document.getElementById('ev-edition').value.trim() || null,
          start_date: document.getElementById('ev-start').value || '',

          theme: document.getElementById('ev-theme').value.trim() || null,
          status: document.getElementById('ev-status').value,
          description: document.getElementById('ev-desc').value.trim() || null,
